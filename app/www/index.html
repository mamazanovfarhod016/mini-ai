<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#F5F4EE" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#262624" media="(prefers-color-scheme: dark)">
<title>Mini AI</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app" id="app">
  <!-- Боковое меню: прошлые чаты (хранятся в localStorage телефона) -->
  <aside class="drawer" id="drawer" aria-hidden="true">
    <div class="drawer-head">
      <span class="logo" aria-hidden="true"></span>
      <span class="drawer-title" data-name></span>
    </div>
    <button class="drawer-new" id="drawerNew">
      <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
      <span>Новый чат</span>
    </button>
    <button class="drawer-link" id="drawerHow">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1"/></svg>
      <span>Как я работаю</span>
    </button>
    <div class="drawer-label">Модель</div>
    <div class="engine-switch" id="engineSwitch">
      <button class="engine-opt" data-engine="transformer">Трансформер <small>v0.2</small></button>
      <button class="engine-opt" data-engine="mlp">Классификатор <small>v0.1</small></button>
    </div>
    <div class="drawer-label">Недавние</div>
    <nav class="chat-list" id="chatList"></nav>
    <div class="drawer-foot">
      <div class="avatar">Ф</div>
      <div><div class="foot-name">Фарход</div><div class="foot-sub">офлайн · без интернета</div></div>
    </div>
  </aside>
  <div class="scrim" id="scrim"></div>

  <main class="main">
    <header class="topbar">
      <button class="icon-btn" id="menuBtn" aria-label="Меню">
        <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h10M4 17h16"/></svg>
      </button>
      <button class="model-pill" id="modelBtn">
        <span data-name></span>
        <svg viewBox="0 0 24 24" class="chev"><path d="m7 10 5 5 5-5"/></svg>
      </button>
      <button class="icon-btn" id="newBtn" aria-label="Новый чат">
        <svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
      </button>
    </header>

    <section class="chat" id="chat">
      <div class="empty" id="empty">
        <span class="logo big" aria-hidden="true"></span>
        <h1 class="hello"><span id="helloTime">Привет</span>, <em>Фарход</em></h1>
        <p class="sub">Чем могу помочь?</p>
      </div>
      <div class="messages" id="messages"></div>
    </section>

    <footer class="composer-wrap">
      <div class="chips" id="chips"></div>
      <form class="composer" id="form" autocomplete="off">
        <textarea id="input" rows="1" placeholder="Напиши сообщение…" enterkeyhint="send"></textarea>
        <div class="composer-row">
          <button type="button" class="icon-btn small" id="howBtn" aria-label="Как я работаю">
            <svg viewBox="0 0 24 24"><circle cx="6" cy="6" r="2"/><circle cx="6" cy="18" r="2"/><circle cx="18" cy="12" r="2"/><path d="M8 6.8 16 11M8 17.2 16 13"/></svg>
          </button>
          <span class="composer-hint">офлайн · <span data-params></span> параметров</span>
          <button type="submit" class="send" id="send" aria-label="Отправить" disabled>
            <svg viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
          </button>
        </div>
      </form>
    </footer>
  </main>

  <!-- Шторка «Как я работаю» — окно внутрь нейросети -->
  <div class="sheet-scrim" id="sheetScrim"></div>
  <section class="sheet" id="sheet" aria-hidden="true">
    <div class="grabber"></div>
    <h2>Как я работаю</h2>
    <div id="sheetBody"></div>
  </section>
</div>
<script src="model.js"></script>
<script src="bpe.js"></script>
<script src="model_transformer.js"></script>
<script src="brain.js"></script>
<script src="transformer.js"></script>
<script src="app.js"></script>
</body>
</html>
